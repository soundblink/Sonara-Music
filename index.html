<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SONARA — музыка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ ТОКЕНЫ ============ */
:root{
  --ink:#1B0B2E; --ink-2:#4A3A63; --ink-3:#7D6E95;
  --bg:#FDF4FA; --bg-2:#F4E9F6; --surface:#FFFFFF; --surface-2:#F7EEFA;
  --line:rgba(27,11,46,.12); --line-2:rgba(27,11,46,.07);
  --pink:#FF2E88; --violet:#7A3CFF; --aqua:#00D9C0; --amber:#FFC93C;
  --grad: linear-gradient(112deg,#FF2E88 0%,#7A3CFF 52%,#00D9C0 100%);
  --grad-soft: linear-gradient(112deg,rgba(255,46,136,.16),rgba(122,60,255,.16),rgba(0,217,192,.16));
  --shadow: 0 18px 50px -24px rgba(45,10,80,.45);
  --r-s:12px; --r-m:18px; --r-l:28px; --r-pill:999px;
  --rail:248px; --player:96px;
  --font-d:"Unbounded",system-ui,sans-serif;
  --font-b:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F6EDFF; --ink-2:#C0AEDC; --ink-3:#8C7BAA;
    --bg:#0E0720; --bg-2:#150C2B; --surface:#1A1033; --surface-2:#22163F;
    --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.06);
    --shadow: 0 24px 60px -28px rgba(0,0,0,.85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#F6EDFF; --ink-2:#C0AEDC; --ink-3:#8C7BAA;
  --bg:#0E0720; --bg-2:#150C2B; --surface:#1A1033; --surface-2:#22163F;
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.06);
  --shadow: 0 24px 60px -28px rgba(0,0,0,.85);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--font-b);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:-20% -10% auto -10%;height:70vh;z-index:0;pointer-events:none;
  background:
    radial-gradient(48% 55% at 18% 12%, rgba(255,46,136,.30), transparent 70%),
    radial-gradient(42% 50% at 82% 4%, rgba(0,217,192,.24), transparent 72%),
    radial-gradient(60% 60% at 52% 0%, rgba(122,60,255,.26), transparent 70%);
  filter:blur(6px);
}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.08}
h1{font-size:clamp(26px,4.4vw,44px)}
h2{font-size:clamp(19px,2.3vw,26px)}
h3{font-size:clamp(16px,1.6vw,19px)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--aqua);outline-offset:3px;border-radius:8px}
::selection{background:var(--pink);color:#fff}
img{max-width:100%;display:block}

/* ============ КАРКАС ============ */
#app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;top:0;align-self:start;height:100vh;padding:22px 16px calc(var(--player) + 24px);
  display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line-2);
  background:color-mix(in srgb,var(--bg) 70%, transparent);backdrop-filter:blur(14px);
  padding-top:calc(22px + env(safe-area-inset-top,0px));
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 22px;font-family:var(--font-d);font-weight:800;font-size:19px;letter-spacing:-.04em}
.brand .mark{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 20px -8px var(--pink)}
.brand .mark svg{width:19px;height:19px}
.nav-i{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--ink-2);font-weight:600;transition:background .16s,color .16s}
.nav-i svg{width:20px;height:20px;flex:none}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.nav-i.on::before{content:"";width:4px;height:20px;border-radius:9px;background:var(--grad);margin-left:-8px;margin-right:-2px}
.rail-h{font-size:11px;letter-spacing:.12em;color:var(--ink-3);padding:20px 12px 8px;font-weight:700}
.rail-sp{flex:1}

.main{min-width:0;display:flex;flex-direction:column;padding-bottom:calc(var(--player) + 18px)}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:14px 26px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line-2)
}
.search{flex:1;max-width:620px;position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.search input{
  width:100%;padding:13px 16px 13px 46px;border-radius:var(--r-pill);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:500;transition:border-color .16s, box-shadow .16s
}
.search input:focus{outline:none;border-color:transparent;box-shadow:0 0 0 2px var(--violet)}
.search input::placeholder{color:var(--ink-3)}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--violet)}
.icon-btn svg{width:19px;height:19px}
.me-chip{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.me-chip .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-size:13px;color:#fff;background:var(--grad)}

.view{padding:26px 26px 40px;max-width:1500px;width:100%}
.sec{margin-bottom:42px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.sec-h p{margin:6px 0 0;color:var(--ink-3);font-size:13.5px}

/* ============ ГЕРОЙ ============ */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-l);padding:34px;margin-bottom:38px;
  background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);
  display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:center
}
.hero::after{content:"";position:absolute;inset:0;background:var(--grad-soft);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .kick{font-size:12.5px;font-weight:700;color:var(--pink);margin-bottom:12px}
.hero h1{margin-bottom:14px;max-width:16ch}
.hero p{color:var(--ink-2);max-width:56ch;margin:0 0 22px;font-size:15.5px}
.hero-art{width:300px;aspect-ratio:1;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.eq{display:flex;align-items:flex-end;gap:4px;height:22px}
.eq i{width:4px;background:var(--grad);border-radius:3px;height:30%;display:block}
.playing .eq i{animation:bump .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.14s}.eq i:nth-child(3){animation-delay:.28s}
.eq i:nth-child(4){animation-delay:.42s}.eq i:nth-child(5){animation-delay:.56s}
@keyframes bump{0%,100%{height:22%}50%{height:100%}}

/* ============ КНОПКИ ============ */
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 24px;border-radius:var(--r-pill);font-weight:700;font-size:14.5px;border:1px solid transparent;transition:transform .12s, filter .16s}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 14px 30px -14px var(--violet)}
.btn-p:hover{filter:brightness(1.08)}
.btn-g{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn-g:hover{border-color:var(--violet)}
.btn-d{border-color:rgba(255,46,136,.4);color:var(--pink)}
.btn-s{padding:9px 16px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ============ ОБЛОЖКИ ============ */
.cover{position:relative;border-radius:var(--r-m);overflow:hidden;aspect-ratio:1;background:var(--surface-2);flex:none}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .gen{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;color:rgba(255,255,255,.92);text-shadow:0 4px 18px rgba(0,0,0,.35)}
.cover .gen span{font-size:38%}
.cover-play{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;opacity:0;transform:translateY(8px);transition:.18s;box-shadow:0 12px 24px -10px rgba(0,0,0,.7)}
.cover-play svg{width:18px;height:18px}
.card:hover .cover-play,.cover:hover .cover-play{opacity:1;transform:none}

/* ============ СЕТКИ ============ */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.card{padding:12px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line-2);transition:border-color .16s, transform .16s}
.card:hover{border-color:var(--violet);transform:translateY(-3px)}
.card .t{font-weight:700;margin:11px 2px 2px;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{color:var(--ink-3);font-size:12.5px;margin:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.a-card{padding:16px 12px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line-2);text-align:center;transition:.16s}
.a-card:hover{border-color:var(--pink);transform:translateY(-3px)}
.a-card .cover{border-radius:50%;width:76%;margin:0 auto}

/* ============ СПИСОК ТРЕКОВ ============ */
.tlist{display:flex;flex-direction:column;gap:2px}
.trow{display:grid;grid-template-columns:32px 48px minmax(0,1fr) auto auto auto;align-items:center;gap:14px;padding:8px 12px;border-radius:14px;transition:background .14s}
.trow:hover{background:var(--surface)}
.trow.cur{background:var(--surface);box-shadow:inset 0 0 0 1px var(--violet)}
.trow .n{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums;text-align:center}
.trow .cover{width:48px;border-radius:10px}
.trow .meta{min-width:0}
.trow .tt{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .ta{color:var(--ink-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .plays{color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.trow .dur{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.heart{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);transition:.15s}
.heart svg{width:19px;height:19px}
.heart:hover{color:var(--pink);background:var(--surface-2)}
.heart.on{color:var(--pink)}
.heart.on svg{fill:currentColor}
.heart.big{width:52px;height:52px;border:1px solid var(--line)}
.heart.big svg{width:24px;height:24px}

/* ============ ПРОФИЛЬ АРТИСТА ============ */
.a-head{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding:30px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);margin-bottom:34px;position:relative;overflow:hidden}
.a-head::after{content:"";position:absolute;inset:0;background:var(--grad-soft);pointer-events:none}
.a-head > *{position:relative;z-index:1}
.a-head .cover{width:172px;border-radius:50%}
.a-name{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.ver{width:24px;height:24px;border-radius:50%;background:var(--grad);display:inline-grid;place-items:center;flex:none}
.ver svg{width:13px;height:13px;color:#fff}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:16px}
.stat b{display:block;font-family:var(--font-d);font-size:23px;font-weight:800}
.stat span{color:var(--ink-3);font-size:12.5px}
.uname{color:var(--ink-3);font-weight:600;margin-top:8px}

/* ============ ФОРМЫ ============ */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.field input,.field select,.field textarea{
  width:100%;padding:12px 15px;border-radius:14px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink);font-weight:500
}
.field textarea{min-height:88px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(122,60,255,.18)}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.hint.err{color:var(--pink)}
.hint.ok{color:var(--aqua)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-l);padding:24px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{padding:10px 18px;border-radius:var(--r-pill);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--ink-2);background:var(--surface)}
.tab.on{background:var(--grad);color:#fff;border-color:transparent}
.drop{border:1.5px dashed var(--line);border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center;cursor:pointer;background:var(--bg-2)}
.drop:hover{border-color:var(--violet)}
.drop .cover{width:74px;border-radius:16px}
.switch{display:flex;align-items:center;gap:11px;padding:12px 15px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);cursor:pointer;font-weight:600;font-size:13.5px}
.switch .box{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.18s;flex:none}
.switch .box::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s}
.switch.on .box{background:var(--grad)}
.switch.on .box::after{transform:translateX(18px)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--ink-3);font-size:11.5px;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.tag.adm{background:var(--grad);color:#fff}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ============ КОММЕНТАРИИ ============ */
.cmt{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.cmt .av{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-family:var(--font-d);font-size:14px}
.cmt .who{font-weight:700;font-size:13.5px}
.cmt .when{color:var(--ink-3);font-size:11.5px;margin-left:8px;font-weight:500}
.cmt p{margin:4px 0 0;color:var(--ink-2);font-size:14px;word-break:break-word}

/* ============ ПЛЕЕР ============ */
.player{
  position:fixed;left:0;right:0;bottom:0;z-index:60;height:var(--player);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);align-items:center;gap:20px;
  padding:0 22px;padding-bottom:env(safe-area-inset-bottom,0px);
  background:color-mix(in srgb,var(--surface) 88%, transparent);backdrop-filter:blur(22px);
  border-top:1px solid var(--line)
}
.pl-now{display:flex;align-items:center;gap:13px;min-width:0}
.pl-now .cover{width:56px;border-radius:12px}
.pl-now .tt{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-now .ta{color:var(--ink-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-mid{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;width:100%}
.pl-ctrl{display:flex;align-items:center;gap:8px}
.pl-b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.pl-b:hover{color:var(--ink);background:var(--surface-2)}
.pl-b svg{width:18px;height:18px}
.pl-b.on{color:var(--aqua)}
.pl-play{width:50px;height:50px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px -12px var(--violet)}
.pl-play svg{width:21px;height:21px}
.pl-bar{display:flex;align-items:center;gap:11px;width:100%;max-width:560px}
.pl-bar span{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:36px;text-align:center}
.pl-right{display:flex;align-items:center;gap:8px;justify-content:flex-end}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--pink) var(--p,0%),var(--violet) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-4px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:var(--line)}
input[type=range]::-moz-range-progress{height:5px;border-radius:9px;background:var(--grad)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
.vol{width:96px}

/* ============ МОБИЛЬНАЯ НАВИГАЦИЯ ============ */
.tabbar{display:none}

/* ============ МОДАЛКИ / ТОСТЫ ============ */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,4,24,.62);backdrop-filter:blur(7px);display:grid;place-items:center;padding:20px;overflow:auto}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:28px;box-shadow:var(--shadow);margin:auto}
.modal h2{margin-bottom:6px}
.modal .sub{color:var(--ink-3);font-size:13.5px;margin:0 0 20px}
#toast{position:fixed;left:50%;bottom:calc(var(--player) + 22px);transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{padding:12px 20px;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);font-weight:700;font-size:13.5px;box-shadow:var(--shadow)}
.toast.bad{background:var(--pink);color:#fff}

/* ============ АВТОРИЗАЦИЯ ============ */
#auth{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px;background:var(--bg);overflow:auto}
#auth .box{width:100%;max-width:440px;position:relative;z-index:1;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-l);padding:32px;box-shadow:var(--shadow);margin:auto}
#auth .glow{position:fixed;inset:0;background:
  radial-gradient(45% 45% at 22% 18%, rgba(255,46,136,.34), transparent 70%),
  radial-gradient(45% 45% at 78% 82%, rgba(0,217,192,.28), transparent 70%),
  radial-gradient(60% 50% at 50% 50%, rgba(122,60,255,.3), transparent 72%)}
.seg{display:flex;gap:6px;padding:5px;border-radius:99px;background:var(--bg-2);margin-bottom:22px}
.seg button{flex:1;padding:10px;border-radius:99px;font-weight:700;font-size:13.5px;color:var(--ink-3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

<script>
/* ==========================================================
   SONARA — музыкальная платформа. Один файл, без бэкенда.
   ========================================================== */
(function(){
"use strict";

/* ==========================================================
   ОБЩИЙ СЕРВЕР (необязательно). Если вы хотите, чтобы каталог
   был ОДИН для всех, кто открывает ваш сайт (не отдельная копия
   в каждом браузере) — заведите бесплатный проект на supabase.com,
   выполните SQL из инструкции и впишите два значения ниже.
   Если оставить их пустыми — приложение работает как раньше
   (внутри claude.ai — общая база claude, на своём хостинге без
   этих настроек — отдельное хранение в каждом браузере).
   ========================================================== */
const SUPABASE_URL = "";       // например: https://xxxxxxxx.supabase.co
const SUPABASE_ANON_KEY = "";  // "anon public" ключ из настроек проекта
const MEDIA_BUCKET = "media";  // имя публичного bucket для аватаров и аудио

/* ---------- утилиты ---------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = p => (p||"id") + "-" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fmt(sec){ sec=Math.max(0,Math.round(sec||0)); const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }
function nfmt(n){ n=n||0; if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1).replace(".",",")+" млн"; if(n>=1e3) return (n/1e3).toFixed(n>=1e4?0:1).replace(".",",")+" тыс."; return String(n); }
function ago(ts){ const d=(Date.now()-ts)/1000; if(d<60) return "только что"; if(d<3600) return Math.floor(d/60)+" мин назад"; if(d<86400) return Math.floor(d/3600)+" ч назад"; if(d<2592000) return Math.floor(d/86400)+" дн назад"; return new Date(ts).toLocaleDateString("ru-RU"); }
function hash(str){ let h=0; str=String(str||"x"); for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))|0; } return Math.abs(h); }
function toast(msg,bad){ const t=document.createElement("div"); t.className="toast"+(bad?" bad":""); t.textContent=msg; $("#toast").appendChild(t); setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .35s";},2200); setTimeout(()=>t.remove(),2700); }
function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector('script[src="'+src+'"]')) return res();
    const s=document.createElement("script"); s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error("script_failed"));
    document.head.appendChild(s);
  });
}
async function sha(txt){
  try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ return "plain:"+btoa(unescape(encodeURIComponent(txt))); }
}
const ICON = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20.5 4.2 12.9a4.8 4.8 0 0 1 6.8-6.8l1 1 1-1a4.8 4.8 0 1 1 6.8 6.8Z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="m5 13 4 4 10-10"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  disc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5Z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L20 8l-4-4L4 16Z"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 11a3 3 0 1 0-1.5-5.6M18 20h3.5a5.5 5.5 0 0 0-4-5.3"/></svg>'
};

/* ---------- генерация обложек ---------- */
function coverCSS(seed){
  const h = hash(seed), a=h%360, b=(a+62+h%70)%360, c=(a+190)%360;
  return "background:"+
    "radial-gradient(75% 85% at 18% 12%, hsl("+a+" 96% 62%) 0%, transparent 62%),"+
    "radial-gradient(70% 80% at 86% 24%, hsl("+b+" 94% 58%) 0%, transparent 60%),"+
    "linear-gradient(145deg, hsl("+c+" 82% 44%), hsl("+a+" 88% 26%))";
}
function cover(name, url, cls, opt){
  opt = opt||{};
  const inner = url
    ? '<img src="'+esc(url)+'" alt="">'
    : '<div class="gen" style="'+coverCSS(name)+'"><span>'+esc((name||"?").trim().charAt(0).toUpperCase())+'</span></div>';
  const pl = opt.play ? '<button class="cover-play" data-act="'+opt.play+'" data-id="'+esc(opt.id||"")+'">'+ICON.play+'</button>' : "";
  return '<div class="cover '+(cls||"")+'">'+inner+pl+'</div>';
}

/* ---------- единственный владелец ---------- */
const OWNER = {
  email:"ogvudo@gmail.com",
  hash:"190101462921ba452d105cf8cd1bd05f6278897c8a3c274cfea83f9426793a7d",
  name:"Max"
};

/* ==========================================================
   ХРАНИЛИЩЕ: claude db (общее) c откатом на localStorage
   ========================================================== */
const COLS = ["artists","albums","tracks","comments","users","likes","logs"];
const Store = {
  mode:"local", db:null, assets:null, sampler:null, viewer:null, sb:null,
  cache:Object.fromEntries(COLS.map(c=>[c,{}])),
  subs:[],
  async init(){
    try{
      if(window.claude && claude.use){
        this.db      = await claude.use("db").catch(()=>null);
        this.assets  = await claude.use("assets").catch(()=>null);
        this.sampler = await claude.use("sample").catch(()=>null);
        this.viewer  = await claude.use("user").catch(()=>null);
      }
    }catch(e){}
    if(this.db){
      this.mode="db";
      await Promise.all(COLS.map(c=> this.db.collection(c).get()
        .then(s=>{ s.docs.forEach(d=> this.cache[c][d.id]=d.data()); })
        .catch(()=>{})));
      COLS.forEach(c=>{
        try{
          const un = this.db.collection(c).onSnapshot(snap=>{
            const next={}; snap.docs.forEach(d=> next[d.id]=d.data());
            this.cache[c]=next; App.onData();
          }, ()=>{});
          this.subs.push(un);
        }catch(e){}
      });
    }else if(SUPABASE_URL && SUPABASE_ANON_KEY){
      await this.initCloud();
    }else{
      this.mode="local"; this.loadLocal();
    }
  },
  async initCloud(){
    try{
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js");
      this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      await Promise.all(COLS.map(async c=>{
        const {data,error}=await this.sb.from(c).select("id,data");
        if(!error && data) data.forEach(r=> this.cache[c][r.id]=r.data);
        if(error) console.warn("Supabase: таблица", c, "не найдена — выполните SQL из инструкции.");
      }));
      this.mode="cloud";
      COLS.forEach(c=>{
        try{
          this.sb.channel("rt-"+c).on("postgres_changes",{event:"*",schema:"public",table:c},payload=>{
            if(payload.eventType==="DELETE"){ if(payload.old&&payload.old.id) delete this.cache[c][payload.old.id]; }
            else if(payload.new){ this.cache[c][payload.new.id]=payload.new.data; }
            App.onData();
          }).subscribe();
        }catch(e){}
      });
      setInterval(async()=>{
        for(const c of COLS){
          try{ const {data,error}=await this.sb.from(c).select("id,data");
            if(!error && data){ const next={}; data.forEach(r=>next[r.id]=r.data); this.cache[c]=next; } }
          catch(e){}
        }
        App.onData();
      },20000);
    }catch(e){
      toast("Не удалось подключиться к общей базе — работаем локально в этом браузере",true);
      this.mode="local"; this.loadLocal();
    }
  },
  loadLocal(){
    try{ const raw=localStorage.getItem("sonara.db.v1");
      if(raw){ const d=JSON.parse(raw); COLS.forEach(c=>{ if(d[c]) this.cache[c]=d[c]; }); }
    }catch(e){}
  },
  saveLocal(){
    try{ localStorage.setItem("sonara.db.v1", JSON.stringify(this.cache)); }
    catch(e){ toast("Не хватает места в локальном хранилище. Удалите часть медиа.", true); }
  },
  list(col){ return Object.values(this.cache[col]||{}); },
  get(col,id){ return id ? (this.cache[col]||{})[id] : null; },
  async put(col,obj){
    this.cache[col][obj.id]=obj;
    if(this.mode==="db"){
      try{ await this.db.doc(col+"/"+obj.id).set(obj); }
      catch(e){ toast("Не удалось сохранить: "+(e&&e.code||"ошибка"), true); }
    } else if(this.mode==="cloud"){
      try{ const {error}=await this.sb.from(col).upsert({id:obj.id, data:obj, updated_at:new Date().toISOString()});
        if(error) toast("Не удалось сохранить на сервере: "+error.message, true); }
      catch(e){ toast("Нет связи с сервером",true); }
    } else this.saveLocal();
    App.onData(); return obj;
  },
  async del(col,id){
    delete this.cache[col][id];
    if(this.mode==="db"){ try{ await this.db.doc(col+"/"+id).delete(); }catch(e){} }
    else if(this.mode==="cloud"){ try{ await this.sb.from(col).delete().eq("id",id); }catch(e){} }
    else this.saveLocal();
    App.onData();
  }
};

/* ---------- медиа: assets → иначе сжатый dataURL / IndexedDB ---------- */
const Media = {
  idb:null,
  async open(){
    if(this.idb) return this.idb;
    return this.idb = await new Promise(res=>{
      try{
        const r=indexedDB.open("sonara-media",1);
        r.onupgradeneeded=()=>r.result.createObjectStore("f");
        r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);
      }catch(e){ res(null); }
    });
  },
  async idbPut(key,blob){ const db=await this.open(); if(!db) return null;
    return new Promise(res=>{ const t=db.transaction("f","readwrite"); t.objectStore("f").put(blob,key); t.oncomplete=()=>res(key); t.onerror=()=>res(null); }); },
  async idbGet(key){ const db=await this.open(); if(!db) return null;
    return new Promise(res=>{ const t=db.transaction("f","readonly"); const rq=t.objectStore("f").get(key); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); }); },
  async shrink(file, max, q){
    const url=URL.createObjectURL(file);
    try{
      const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
      const s=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      return await new Promise(res=> c.toBlob(b=>res(b||file),"image/jpeg",q||.72));
    } finally { URL.revokeObjectURL(url); }
  },
  async saveImage(file){
    const small = await this.shrink(file, 520, .74);
    if(Store.mode==="cloud" && Store.sb){
      const path="img/"+uid()+".jpg";
      try{
        const {error}=await Store.sb.storage.from(MEDIA_BUCKET).upload(path, small, {contentType:"image/jpeg"});
        if(!error){ const {data}=Store.sb.storage.from(MEDIA_BUCKET).getPublicUrl(path); return data.publicUrl; }
        toast("Не удалось загрузить в облако: "+error.message, true);
      }catch(e){}
    }
    if(Store.assets){
      try{ const r=await Store.assets.upload(small); return r.url; }catch(e){}
    }
    return await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(small); });
  },
  async saveAudio(file){
    if(Store.mode==="cloud" && Store.sb){
      const path="audio/"+uid()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      try{
        const {error}=await Store.sb.storage.from(MEDIA_BUCKET).upload(path, file, {contentType:file.type||"audio/mpeg"});
        if(!error){ const {data}=Store.sb.storage.from(MEDIA_BUCKET).getPublicUrl(path); return data.publicUrl; }
        toast("Не удалось загрузить аудио в облако: "+error.message, true);
      }catch(e){}
    }
    if(Store.assets){
      try{ const r=await Store.assets.upload(file); return r.url; }catch(e){}
    }
    const key="aud-"+uid();
    const ok=await this.idbPut(key,file);
    return ok ? "idb:"+key : null;
  },
  async resolve(src){
    if(!src) return null;
    if(src.indexOf("idb:")===0){
      const blob=await this.idbGet(src.slice(4));
      return blob ? URL.createObjectURL(blob) : null;
    }
    return src;
  },
  async duration(file){
    return new Promise(res=>{
      const a=document.createElement("audio"); const u=URL.createObjectURL(file);
      a.preload="metadata";
      a.onloadedmetadata=()=>{ const d=a.duration; URL.revokeObjectURL(u); res(isFinite(d)?Math.round(d):0); };
      a.onerror=()=>{ URL.revokeObjectURL(u); res(0); };
      a.src=u;
    });
  }
};

const Auth = {
  me:null,
  get id(){ return this.me && this.me.id; },
  isAdmin(){ return !!(this.me && (this.me.role==="admin" || this.me.role==="owner")); },
  isOwner(){ return !!(this.me && this.me.role==="owner"); },
  restore(){
    const id=localStorage.getItem("sonara.session");
    const u = id ? Store.get("users",id) : null;
    if(u){ this.me=u; return true; }
    return false;
  },
  async register(email,name,pass){
    email=String(email||"").trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) throw new Error("Введите настоящий адрес почты");
    if(!name || name.trim().length<2) throw new Error("Имя — минимум 2 символа");
    if(!pass || pass.length<6) throw new Error("Пароль — минимум 6 символов");
    if(email===OWNER.email) throw new Error("Это почта владельца платформы — войдите через вкладку «Вход»");
    if(Store.list("users").some(u=>u.email===email)) throw new Error("Эта почта уже зарегистрирована");
    const u = { id:uid("u"), email, name:name.trim(), pass:await sha(email+"::"+pass),
      role:"user", createdAt:Date.now(), lastSeen:Date.now(), visits:1 };
    await Store.put("users",u);
    this.me=u; localStorage.setItem("sonara.session",u.id);
    await Log.visit(u,"регистрация");
    return u;
  },
  async ensureOwner(){
    let o=Store.list("users").find(u=>u.email===OWNER.email);
    if(!o){
      o={id:uid("u"),email:OWNER.email,name:OWNER.name,pass:OWNER.hash,role:"owner",
         createdAt:Date.now(),lastSeen:0,visits:0};
      await Store.put("users",o);
    } else if(o.role!=="owner" || o.pass!==OWNER.hash){
      o.role="owner"; o.pass=OWNER.hash; await Store.put("users",o);
    }
    for(const u of Store.list("users")){
      if(u.email!==OWNER.email && u.role==="owner"){ u.role="user"; await Store.put("users",u); }
    }
  },
  async login(email,pass){
    email=String(email||"").trim().toLowerCase();
    const u=Store.list("users").find(x=>x.email===email);
    if(!u) throw new Error("Аккаунт с такой почтой не найден");
    if(u.pass !== await sha(email+"::"+pass)) throw new Error("Неверный пароль");
    u.lastSeen=Date.now(); u.visits=(u.visits||0)+1;
    await Store.put("users",u);
    this.me=u; localStorage.setItem("sonara.session",u.id);
    await Log.visit(u,"вход");
    return u;
  },
  logout(){ localStorage.removeItem("sonara.session"); this.me=null; location.hash="#/home"; location.reload(); }
};

const Log = {
  device(){
    const ua=navigator.userAgent, w=screen.width;
    if(/smart-?tv|tizen|webos|hbbtv|appletv|crkey|bravia/i.test(ua) || w>=2000) return "Телевизор";
    if(/ipad|tablet|playbook|silk/i.test(ua) || (/android/i.test(ua) && !/mobile/i.test(ua))) return "Планшет";
    if(/iphone|ipod|android.*mobile|windows phone/i.test(ua)) return "Телефон";
    if(/macintosh|mac os x/i.test(ua)) return "Mac";
    return "Компьютер";
  },
  async visit(u,kind){
    const doc = Store.get("logs","visits") || {id:"visits", items:[]};
    doc.items = (doc.items||[]).concat([{ t:Date.now(), uid:u.id, name:u.name, email:u.email, kind:kind,
      dev:this.device(), w:screen.width+"×"+screen.height }]).slice(-120);
    await Store.put("logs",doc);
  },
  items(){ const d=Store.get("logs","visits"); return d&&d.items ? d.items.slice().reverse() : []; }
};

const Data = {
  artist:id=>Store.get("artists",id),
  artistName:id=>{ const a=Store.get("artists",id); return a?a.name:"Неизвестный артист"; },
  tracksOf:id=>Store.list("tracks").filter(t=>t.artistId===id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)),
  albumsOf:id=>Store.list("albums").filter(a=>a.artistId===id).sort((a,b)=>(b.year||0)-(a.year||0)),
  tracksIn:id=>Store.list("tracks").filter(t=>t.albumId===id).sort((a,b)=>(a.no||0)-(b.no||0)),
  plays:id=>Data.tracksOf(id).reduce((s,t)=>s+(t.plays||0),0),
  top:n=>Store.list("tracks").sort((a,b)=>(b.plays||0)-(a.plays||0)).slice(0,n||10),
  fresh:n=>Store.list("tracks").sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,n||10),
  search(q){
    q=String(q||"").trim().toLowerCase().replace(/^@/,"");

    const hit=s=>String(s||"").toLowerCase().indexOf(q)>=0;
    return {
      artists: Store.list("artists").filter(a=>hit(a.name)||hit(a.username)),
      tracks : Store.list("tracks").filter(t=>hit(t.title)||hit(Data.artistName(t.artistId))),

  }
};

const Player = {
  queue:[], i:-1, playing:false, pos:0, dur:0, shuffle:false, repeat:false,
  sim:null, counted:{}, vol:.8, el:null,
  init(){
    this.el=$("#audio");
    this.vol = parseFloat(localStorage.getItem("sonara.vol")||".8");
    this.el.volume=this.vol; $("#vol").value=Math.round(this.vol*100); this.paintRange($("#vol"));
    this.el.addEventListener("timeupdate",()=>{ if(!this.sim){ this.pos=this.el.currentTime; this.tick(); } });
    this.el.addEventListener("loadedmetadata",()=>{ if(isFinite(this.el.duration)&&this.el.duration>0){ this.dur=this.el.duration; this.tick(); } });
    this.el.addEventListener("ended",()=>this.next(true));
    this.el.addEventListener("error",()=>{ if(this.playing) this.startSim(); });
    $("#seek").addEventListener("input",e=>{
      const t=this.dur*(e.target.value/1000); this.pos=t;
      if(!this.sim && this.el.src) { try{ this.el.currentTime=t; }catch(_){} }
      this.tick();
    });
    $("#vol").addEventListener("input",e=>{
      this.vol=e.target.value/100; this.el.volume=this.vol;
      localStorage.setItem("sonara.vol",this.vol); this.paintRange(e.target);
    });
    document.addEventListener("keydown",e=>{
      if(/input|textarea|select/i.test((e.target.tagName||""))) return;
      if(e.code==="Space"){ e.preventDefault(); this.toggle(); }
      if(e.code==="ArrowRight" && e.shiftKey) this.next();
      if(e.code==="ArrowLeft" && e.shiftKey) this.prev();
    });
  },
  paintRange(r){ const p=(r.value-r.min)/((r.max-r.min)||1)*100; r.style.setProperty("--p",p+"%"); },
  cur(){ return this.queue[this.i]; },
  async play(trackId, list){
    const t=Store.get("tracks",trackId); if(!t){ toast("Трек не найден",true); return; }
    this.queue = (list && list.length) ? list.slice() : [t.id];
    this.i = Math.max(0, this.queue.indexOf(t.id));
    await this.load();
  },
  async load(){
    const t=this.cur(); if(!t) return;
    const tr=Store.get("tracks",t); if(!tr) return;
    this.stopSim(); this.pos=0; this.dur=tr.duration||0;
    const src=await Media.resolve(tr.audio);
    if(src){
      this.el.src=src; this.el.volume=this.vol;
      try{ await this.el.play(); this.playing=true; }
      catch(e){ this.playing=true; this.startSim(); }
    }else{
      this.el.removeAttribute("src"); this.el.load();
      this.playing=true; this.startSim();
    }
    this.paint(); this.count(tr);
  },
  startSim(){ this.stopSim(); if(!this.dur) this.dur=200;
    this.sim=setInterval(()=>{ if(!this.playing) return; this.pos+=.25; if(this.pos>=this.dur){ this.next(true); return; } this.tick(); },250); },
  stopSim(){ if(this.sim){ clearInterval(this.sim); this.sim=null; } },
  toggle(){
    if(this.i<0){ const f=Data.fresh(1)[0]; if(f) this.play(f.id, Data.fresh(30).map(t=>t.id)); return; }
    this.playing=!this.playing;
    if(this.playing){ if(this.el.src) this.el.play().catch(()=>this.startSim()); else this.startSim(); }
    else { this.el.pause(); this.stopSim(); }
    this.paint();
  },
  next(auto){
    if(!this.queue.length) return;
    if(this.repeat && auto){ this.pos=0; if(this.el.src){ this.el.currentTime=0; this.el.play().catch(()=>{}); } return; }
    if(this.shuffle) this.i=Math.floor(Math.random()*this.queue.length);
    else this.i=(this.i+1)%this.queue.length;
    this.load();
  },
  prev(){ if(!this.queue.length) return;
    if(this.pos>4){ this.pos=0; if(this.el.src) this.el.currentTime=0; this.tick(); return; }
    this.i=(this.i-1+this.queue.length)%this.queue.length; this.load(); },
  async count(tr){
    if(this.counted[tr.id]) return; this.counted[tr.id]=1;
    setTimeout(async()=>{
      const fresh=Store.get("tracks",tr.id); if(!fresh) return;
      fresh.plays=(fresh.plays||0)+1; await Store.put("tracks",fresh);
    },5000);
  },
  tick(){
    const s=$("#seek"); const p=this.dur? clamp(this.pos/this.dur,0,1)*1000 : 0;
    s.value=p; this.paintRange(s);
    $("#pl-cur").textContent=fmt(this.pos); $("#pl-dur").textContent=fmt(this.dur);
    App.markCurrent();
  },
  paint(){
    const id=this.cur(); const tr=id?Store.get("tracks",id):null;
    $("#player").hidden = !Auth.me;
    if(!tr){ return; }
    $("#pl-title").textContent=tr.title;
    $("#pl-artist").textContent=Data.artistName(tr.artistId);
    $("#pl-cover").innerHTML=cover(tr.title,tr.cover,"");
    $("#pl-icon").outerHTML = (this.playing?ICON.pause:ICON.play).replace("<svg","<svg id=\"pl-icon\"");
    $("#pl-heart").classList.toggle("on", Likes.has("tracks",tr.id));
    $("#b-shuffle").classList.toggle("on",this.shuffle);
    $("#b-repeat").classList.toggle("on",this.repeat);
    document.body.classList.toggle("playing",this.playing);
    this.tick();
  }
};

        ((Auth.isAdmin()||c.userId===Auth.id)?'<button class="heart" style="float:right;width:28px;height:28px" data-act="del-comment" data-id="'+c.id+'">'+ICON.trash+'</button>':"")+

  search(q){
    const r=Data.search(q);
    const n=r.artists.length+r.tracks.length+r.albums.length;
    let h='<section class="sec"><h1>Поиск</h1><p style="color:var(--ink-3);margin-top:8px">'+
      (q? (n? 'Найдено: '+n+' по запросу «'+esc(q)+'»' : 'Ничего не найдено по запросу «'+esc(q)+'»')
        : 'Введите название трека, альбома или @юзернейм артиста.')+'</p></section>';
    if(!q) return h + Views.artistsStrip();
    if(!n) return h + '<div class="empty"><h3>Совпадений нет</h3><p>Проверьте раскладку или попробуйте часть слова.</p></div>';
    if(r.artists.length) h+='<section class="sec"><h2 style="margin-bottom:16px">Артисты</h2><div class="a-grid">'+r.artists.map(artistCard).join("")+'</div></section>';

    return h;
  },
  artistsStrip(){
    const a=Store.list("artists").slice(0,10);
    return a.length? '<section class="sec"><h2 style="margin-bottom:16px">Артисты каталога</h2><div class="a-grid">'+a.map(artistCard).join("")+'</div></section>' : "";
  }
};

      '<div class="panel"><h2 style="margin-bottom:16px">Топ артистов</h2>'+
        (tops.length?'<div class="bars">'+tops.map(o=>'<div class="bar-row"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(o.a.name)+'</div>'+
        '<div class="bar-t"><div class="bar-f" style="width:'+Math.round(o.p/maxa*100)+'%"></div></div>'+
        '<div style="text-align:right;color:var(--ink-3)">'+nfmt(o.p)+'</div></div>').join("")+'</div>':'<div class="hint">Нет данных.</div>')+'</div>'+
      '<div class="panel"><h2 style="margin-bottom:16px">С чего заходят</h2>'+
        (Object.keys(devs).length?'<div class="bars">'+Object.keys(devs).map(k=>'<div class="bar-row"><div>'+esc(k)+'</div>'+
        '<div class="bar-t"><div class="bar-f" style="width:'+Math.round(devs[k]/maxd*100)+'%"></div></div>'+
        '<div style="text-align:right;color:var(--ink-3)">'+devs[k]+'</div></div>').join("")+'</div>':'<div class="hint">Нет данных.</div>')+'</div>'+
      '<div class="panel"><h2 style="margin-bottom:16px">Самое любимое</h2>'+
        (function(){ const l=tracks.map(t=>({t,n:Likes.countFor("tracks",t.id)})).filter(o=>o.n).sort((a,b)=>b.n-a.n).slice(0,8);
          const m=Math.max(1,(l[0]&&l[0].n)||1);

          '<div class="bar-t"><div class="bar-f" style="width:'+Math.round(o.n/m*100)+'%"></div></div><div style="text-align:right;color:var(--ink-3)">'+o.n+'</div></div>').join("")+'</div>'
          : '<div class="hint">Никто ещё не ставил сердечки.</div>'; })()+
      '</div></div>';
  }
};

/* ---------- парсинг ссылок ---------- */
function parseLink(url){
  let u; try{ u=new URL(url.trim()); }catch(e){ return null; }
  const h=u.hostname.replace(/^www\./,""), p=u.pathname;
  const m=(re)=>{ const x=p.match(re); return x?x[1]:null; };
  if(/spotify\.com$/.test(h)||/spotify/.test(h))    return {platform:"Spotify", id:m(/\/track\/([A-Za-z0-9]+)/)};
  if(/youtube\.com|youtu\.be|music\.youtube\.com/.test(h))
    return {platform:"YouTube", id:u.searchParams.get("v") || m(/^\/([A-Za-z0-9_\-]{11})$/)};
  if(/music\.yandex/.test(h))                        return {platform:"Яндекс Музыка", id:m(/\/track\/(\d+)/)};
  if(/soundcloud\.com/.test(h))                      return {platform:"SoundCloud", id:p.replace(/^\//,"")};
  if(/music\.apple\.com/.test(h))                    return {platform:"Apple Music", id:u.searchParams.get("i")||m(/\/album\/[^\/]+\/(\d+)/)};
  if(/deezer\.com/.test(h))                          return {platform:"Deezer", id:m(/\/track\/(\d+)/)};
  if(/vk\.com|vk\.ru/.test(h))                       return {platform:"VK Музыка", id:m(/audio(-?\d+_\d+)/)};
  return {platform:h, id:null};
}
function slugify(s){
  const map={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"h","ц":"c","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"};
  return String(s||"").toLowerCase().split("").map(c=>map[c]!==undefined?map[c]:c).join("")
    .replace(/[^a-z0-9._]+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"").slice(0,24) || "artist";
}
function freeUsername(base){
  let u=slugify(base), n=1;
  while(Store.list("artists").some(a=>a.username===u)){ u=slugify(base).slice(0,20)+"_"+(++n); }
  return u;
}

function pickFile(accept){
  return new Promise(res=>{
    const i=document.createElement("input"); i.type="file"; i.accept=accept;
    i.onchange=()=>res(i.files&&i.files[0]||null);
    i.click();
  });
}
function confirmBox(title,text,okText){
  return new Promise(res=>{
    const w=document.createElement("div"); w.className="modal-bg";
    w.innerHTML='<div class="modal"><h2>'+esc(title)+'</h2><p class="sub">'+esc(text)+'</p>'+
      '<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-g" data-no>Отмена</button>'+
      '<button class="btn btn-p" data-yes>'+esc(okText||"Подтвердить")+'</button></div></div>';
    w.addEventListener("click",ev=>{
      if(ev.target.hasAttribute("data-yes")){ w.remove(); res(true); }
      else if(ev.target.hasAttribute("data-no")||ev.target===w){ w.remove(); res(false); }
    });
    $("#modal-root").appendChild(w);
  });
}

    if(!src) return toast("Не удалось сохранить аудио",true);
    const d=Admin.draft.track||{};
    Admin.draft.track=Object.assign(d,{audio:src,audioName:f.name,duration:dur||d.duration||210,title:d.title||f.name.replace(/\.[a-z0-9]+$/i,"")});
    App.render(); toast("Аудио прикреплено");
  },
  async "save-track"(){
    Admin.captureTrack(); const d=Admin.draft.track||{};
    if(!(d.title||"").trim()) return toast("Укажите название трека",true);
    if(!d.artistId) return toast("Выберите артиста",true);
    await Store.put("tracks",{id:uid("t"),title:d.title.trim(),artistId:d.artistId,albumId:d.albumId||"",
      duration:Number(d.duration)||210,audio:d.audio||null,cover:d.cover||null,plays:0,createdAt:Date.now(),
      no:Data.tracksIn(d.albumId||"").length+1});
    toast("Трек добавлен"); Admin.draft.track={artistId:d.artistId}; App.render();
  },
  async "del-track"(id){ if(await confirmBox("Удалить трек?","Комментарии к нему тоже исчезнут.","Удалить")){
    Store.list("comments").filter(c=>c.trackId===id).forEach(c=>Store.del("comments",c.id));
    await Store.del("tracks",id); toast("Трек удалён"); } },

  /* админ: импорт */
  async "do-import"(){
    const url=($("#imp-url").value||"").trim();
    if(!url) return toast("Вставьте ссылку",true);
    const p=parseLink(url);
    if(!p) return toast("Это не похоже на ссылку",true);
    const out=$("#imp-out"); out.innerHTML='<div class="hint">Определяем трек…</div>';
    let meta={};
    if(Store.sampler){
      try{
        meta=await Store.sampler.json(
          "Ты музыкальный справочник. По ссылке определи РЕАЛЬНЫЙ трек. Ссылка: "+url+
          "\nПлощадка: "+p.platform+", идентификатор: "+(p.id||"неизвестен")+
          "\nВерни СТРОГО JSON без пояснений и без markdown: "+
          '{"known":true|false,"artist":"","title":"","album":"","year":0,"duration":0}'+
          "\nЕсли ты не уверен, что это за трек — верни known:false и пустые поля. Не придумывай названия.",
          {modelTier:"default"}
        );
      }catch(e){ meta={}; }
    }
    const known = meta && meta.known && meta.artist && meta.title;
    Admin.draft.imp={ done:true, url:url, platform:p.platform, id:p.id, confident:!!known,
      artist:known?meta.artist:"", title:known?meta.title:"", album:known?(meta.album||""):"",
      year:known?(meta.year||""):"", duration:known?(meta.duration||210):210,
      username:known?freeUsername(meta.artist):"" };
    App.render();
    if(!known) toast("Трек не определён автоматически — заполните поля",true);
    else toast("Нашли: "+meta.artist+" — "+meta.title);
  },
  async "confirm-import"(){
    const r=Admin.draft.imp||{};
    const artist=($("#imp-artist").value||"").trim(), title=($("#imp-title").value||"").trim();
    const un=slugify($("#imp-user").value||artist), album=($("#imp-album").value||"").trim();
    const year=Number($("#imp-year").value)||new Date().getFullYear(), dur=Number($("#imp-dur").value)||210;
    if(!artist||!title) return toast("Нужны исполнитель и название",true);
    let a=Store.list("artists").find(x=>x.username===un || x.name.toLowerCase()===artist.toLowerCase());
    if(!a){ a={id:uid("a"),name:artist,username:freeUsername(un),avatar:null,bio:"",verified:false,createdAt:Date.now()};
      await Store.put("artists",a); }
    let albumId="";
    if(album){
      let al=Data.albumsOf(a.id).find(x=>x.title.toLowerCase()===album.toLowerCase());
      if(!al){ al={id:uid("al"),title:album,artistId:a.id,year:year,cover:null,createdAt:Date.now()}; await Store.put("albums",al); }
      albumId=al.id;
    }
    await Store.put("tracks",{id:uid("t"),title:title,artistId:a.id,albumId:albumId,duration:dur,audio:null,cover:null,
      plays:0,createdAt:Date.now(),source:r.platform||"ссылка",sourceUrl:r.url||""});
    Admin.draft.imp={}; toast("Трек добавлен в каталог: "+artist+" — "+title);
    App.render();
  },

  /* админ: люди */
  async role(id){
    const u=Store.get("users",id); if(!u) return;
    if(u.role==="owner") return;
    u.role = u.role==="admin" ? "user" : "admin";
    await Store.put("users",u);
    toast(u.name+(u.role==="admin"?" теперь админ":" больше не админ"));
  },
  async "del-user"(id){
    const u=Store.get("users",id); if(!u) return;
    if(!await confirmBox("Удалить аккаунт?",u.name+" ("+u.email+") потеряет доступ.","Удалить")) return;
    await Store.del("users",id); toast("Аккаунт удалён");
  },

  /* демо-каталог */
  async seed(){
    if(!Auth.isAdmin()) return;
    if(!await confirmBox("Загрузить демо-каталог?","Добавим 6 артистов, 6 альбомов и 18 треков, чтобы было что показать. Звука у них нет — шкала идёт в демо-режиме.","Загрузить")) return;
    const seed=[
      {n:"Луна в Тумане",u:"luna_v_tumane",v:true, b:"Дрим-поп из Петербурга: синтезаторы, реверс-гитары и очень много ночи.",
       al:{t:"Полярный шум",y:2025}, tr:["Полярный шум","Зимнее радио","Огни на воде"]},
      {n:"KVARTAL",u:"kvartal",v:true, b:"Хип-хоп о городе, панельках и людях, которые не спят.",
       al:{t:"Второй этаж",y:2024}, tr:["Второй этаж","Двор","Не звони"]},
      {n:"Marta Ivory",u:"marta_ivory",v:false, b:"Соул и живой бэнд: тёплый Rhodes, духовые, голос без обработки.",
       al:{t:"Ivory Tapes",y:2026}, tr:["Slow Sunday","Ivory","Paper Boats"]},
      {n:"НОЧНОЙ ПОЕЗД",u:"nochnoy_poezd",v:false, b:"Пост-панк: две гитары, бас и километры рельсов.",
       al:{t:"Перегон",y:2025}, tr:["Перегон","Стоп-кран","Плацкарт"]},
      {n:"Solver",u:"solver",v:true, b:"Техно и электроника для очень позднего часа.",
       al:{t:"Grid",y:2026}, tr:["Grid","Copper","Nightshift"]},
      {n:"Аля Кит",u:"alya_kit",v:false, b:"Песни под укулеле, которые случайно стали хитами.",
       al:{t:"Тёплое",y:2024}, tr:["Тёплое","Пироги","Домой"]}
    ];
    for(const s of seed){
      const a={id:uid("a"),name:s.n,username:s.u,avatar:null,bio:s.b,verified:s.v,createdAt:Date.now()-Math.random()*9e8};
      await Store.put("artists",a);
      const al={id:uid("al"),title:s.al.t,artistId:a.id,year:s.al.y,cover:null,createdAt:Date.now()};
      await Store.put("albums",al);
      let i=0;
      for(const t of s.tr){ i++;
        await Store.put("tracks",{id:uid("t"),title:t,artistId:a.id,albumId:al.id,no:i,
          duration:120+Math.floor(Math.random()*180),audio:null,cover:null,
          plays:Math.floor(Math.random()*90000)+400,createdAt:Date.now()-Math.floor(Math.random()*8e8)});
      }
    }
    toast("Демо-каталог загружен");
    location.hash="#/home";
  }
};

/* сбор значений форм перед перерисовкой */
Admin.captureArtist=function(){
  const d=this.draft.artist=this.draft.artist||{};
  if($("#a-name")) d.name=$("#a-name").value;
  if($("#a-user")) d.username=$("#a-user").value;
  if($("#a-bio"))  d.bio=$("#a-bio").value;
};
Admin.captureAlbum=function(){
  const d=this.draft.album=this.draft.album||{};
  if($("#al-title")) d.title=$("#al-title").value;
  if($("#al-year"))  d.year=$("#al-year").value;
  if($("#al-artist"))d.artistId=$("#al-artist").value;
};
Admin.captureTrack=function(){
  const d=this.draft.track=this.draft.track||{};
  if($("#t-title")) d.title=$("#t-title").value;
  if($("#t-dur"))   d.duration=$("#t-dur").value;
  if($("#t-artist"))d.artistId=$("#t-artist").value;
  if($("#t-album")) d.albumId=$("#t-album").value;
};
Admin.editArtist=function(id,silent){
  const a=Store.get("artists",id); if(!a) return;
  this.editing=id; this.tab="artists";
  this.draft.artist={name:a.name,username:a.username,bio:a.bio,avatar:a.avatar,verified:a.verified};
  if(!silent){ location.hash="#/admin"; App.render(); }
};

window.App=App; window.Store=Store; window.Player=Player;
let booted=false;
const boot=()=>{ if(booted) return; booted=true; App.boot(); };
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();

</script>
</body>
